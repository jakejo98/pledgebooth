<div class="modal_overlay" id="reset_modal_overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset_modal_title">
    <button type="button" class="modal_close" id="reset_modal_close" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="eyebrow">Reset Password</div>
    <h2 class="heading" id="reset_modal_title">비밀번호 재설정</h2>
    <p class="subheading">가입하신 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드려요.</p>

    <form id="form_reset_password" novalidate>
      <div class="field">
        <label for="reset_email">이메일</label>
        <input type="email" id="reset_email" name="resetEmail" placeholder="business@example.com" autocomplete="email" required>
        <div class="hint" id="reset_email_hint"></div>
      </div>

      <button type="submit" class="btn_primary" id="reset_submit">재설정 링크 보내기</button>
    </form>

    <p class="modal_success" id="reset_success_msg" hidden>재설정 메일을 보냈어요. 메일함을 확인해주세요.</p>
  </div>
</div>
