<div class="calendar_popup" hidden>
  <div class="calendar_header">
    <button type="button" class="calendar_nav calendar_prev" aria-label="이전 달">
      <img src="../assets/icons/icon_prev.svg" alt="">
    </button>
    <span class="calendar_title"></span>
    <button type="button" class="calendar_nav calendar_next" aria-label="다음 달">
      <img src="../assets/icons/icon_prev.svg" class="icon_flip" alt="">
    </button>
  </div>
  <div class="calendar_weekdays">
    <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
  </div>
  <div class="calendar_days"></div>
</div>
