<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Pledge - 비밀번호 재설정</title>
<link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/auth.css">
<script type="module" src="../js/resetPassword.js"></script>
</head>
<body>

<section class="common_section">
  <div class="container">
    <!-- 로고 영역 -->
    <div class="logo_wrap">
      <img src="../assets/images/logo.svg" class="logo" alt="로고 이미지">
      <p class="logo_description">가장 아름다운 순간을 기록하세요.</p>
    </div>

    <div class="eyebrow">Reset Password</div>
    <h2 class="heading">새 비밀번호 설정</h2>
    <p class="subheading" id="reset_subheading">잠시만 기다려주세요...</p>

    <form id="form_new_password" novalidate hidden>
      <div class="field">
        <label for="new_password">새 비밀번호</label>
        <input type="password" id="new_password" name="newPassword" placeholder="8자 이상 입력" autocomplete="new-password" required minlength="8">
        <div class="hint" id="new_password_hint"></div>
      </div>

      <div class="field">
        <label for="new_password_confirm">새 비밀번호 확인</label>
        <input type="password" id="new_password_confirm" name="newPasswordConfirm" placeholder="비밀번호 다시 입력" autocomplete="new-password" required>
        <div class="hint" id="new_password_confirm_hint"></div>
      </div>

      <button type="submit" class="btn_primary" id="reset_password_submit">비밀번호 변경하기</button>
    </form>

    <div id="reset_password_result" hidden>
      <p class="subheading" id="reset_password_result_msg"></p>
      <button type="button" class="btn_primary" id="go_to_login">로그인 화면으로</button>
    </div>

  </div>
</section>
</body>
</html>
