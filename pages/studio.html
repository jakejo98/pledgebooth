<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pledge - 포토 스튜디오</title>
<link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/studio.css">
<script type="module" src="../js/studio.js"></script>
</head>
<body class="studio_body">

<div class="camera_stage">
  <video id="camera_preview" autoplay playsinline muted></video>
  <img id="captured_photo" alt="촬영된 사진" hidden>
  <div class="camera_caption" id="camera_caption"></div>

  <div class="camera_topbar">
    <button type="button" class="close_btn" id="close_btn" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <p class="camera_hint" id="camera_hint"></p>

  <div class="camera_controls" id="camera_controls">
    <button type="button" class="shutter_btn" id="shutter_btn" disabled aria-label="촬영하기"></button>
  </div>

  <div class="camera_controls_after" id="camera_controls_after" hidden>
    <button type="button" class="ghost_btn" id="retake_btn">다시 찍기</button>
    <a class="ghost_btn" id="download_btn" href="#" download="pledge-photo.png">저장</a>
  </div>
</div>

<canvas id="capture_canvas" hidden></canvas>

</body>
</html>
