<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE0">
<title>Snap & Vow Partners — 업체 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold: #C9A227;
  --gold-light: #D9B84D;
  --gold-dark: #9C7C18;
  --ivory: #F5EFE0;
  --ivory-2: #FBF8F1;
  --charcoal: #2B2420;
  --line: #E2D6B8;
  --ink: #3A2F22;
  --ink-soft: #7A6F5D;
  --white: #FFFDF9;
  --error: #B5533C;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:'Pretendard','Noto Sans KR',sans-serif;
  background:var(--ivory);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.stage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px 56px;
  background:
    radial-gradient(60% 50% at 50% 0%, rgba(201,162,39,0.10), transparent 65%),
    var(--ivory);
}

.card{
  width:100%;
  max-width:408px;
}

.brand-mark{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:36px;
}
.brand-mark svg{ width:28px; height:28px; flex-shrink:0; }
.brand-logo{ height:auto; width:150px; max-width:60%; }
.brand-name{
  font-size:17px;
  font-weight:700;
  letter-spacing:0.04em;
  color:var(--charcoal);
}

.tabs{
  display:flex;
  border-bottom:1px solid var(--line);
  margin-bottom:34px;
}
.tab{
  flex:1;
  background:none;
  border:none;
  padding:0 0 16px;
  font-size:16px;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
  position:relative;
  letter-spacing:0.01em;
  transition:color 0.25s ease;
}
.tab.active{ color:var(--ink); }
.tab::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:-1px;
  height:2px;
  background:var(--gold);
  transform:scaleX(0);
  transition:transform 0.3s ease;
}
.tab.active::after{ transform:scaleX(1); }

.eyebrow{
  font-size:11px;
  font-weight:600;
  letter-spacing:0.22em;
  color:var(--gold-dark);
  text-transform:uppercase;
  margin-bottom:10px;
}
.heading{
  font-size:23px;
  font-weight:700;
  color:var(--ink);
  margin-bottom:6px;
  letter-spacing:-0.01em;
}
.subheading{
  font-size:13.5px;
  color:var(--ink-soft);
  margin-bottom:30px;
  line-height:1.6;
}

.panes{ position:relative; }
.pane{ display:none; }
.pane.active{ display:block; animation:fade 0.35s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

form{ display:flex; flex-direction:column; gap:20px; }

.field{ position:relative; }
.field label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-soft);
  margin-bottom:7px;
  letter-spacing:0.01em;
}
.field .input-wrap{ position:relative; }
.field input{
  width:100%;
  background:var(--ivory-2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:13px 14px;
  font-size:14.5px;
  color:var(--ink);
  font-family:inherit;
  outline:none;
  transition:border-color 0.2s ease, box-shadow 0.2s ease;
}
.field input::placeholder{ color:#B8A98A; }
.field input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,162,39,0.15);
}
.field .toggle-pw{
  position:absolute;
  right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer;
  color:var(--ink-soft); padding:4px;
  display:flex; align-items:center;
}
.field .toggle-pw svg{ width:18px; height:18px; }
.hint{ font-size:11.5px; color:var(--error); min-height:2px; margin-top:5px; }

.row-between{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12.5px;
}
.check{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink-soft);
  cursor:pointer;
  user-select:none;
}
.check input{ accent-color:var(--gold-dark); width:14px; height:14px; }
.link-muted{
  color:var(--gold-dark);
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:border-color 0.2s ease;
}
.link-muted:hover{ border-color:var(--gold-dark); }

.terms{
  font-size:12px;
  color:var(--ink-soft);
  line-height:1.6;
}
.terms a{ color:var(--gold-dark); text-decoration:underline; text-underline-offset:2px; }
.terms-link{ color:var(--ink-soft) !important; text-decoration:underline; text-underline-offset:2px; }
.terms-link:hover{ color:var(--gold-dark) !important; }

.logo-upload{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--ivory-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px;
  transition:border-color 0.2s ease, background 0.2s ease;
}
.logo-upload.drag{ border-color:var(--gold); background:#FBF3DD; }
.logo-preview{
  width:52px;
  height:52px;
  flex-shrink:0;
  border-radius:6px;
  background:var(--white);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ink-soft);
  overflow:hidden;
}
.logo-preview svg{ width:22px; height:22px; }
.logo-preview img{ width:100%; height:100%; object-fit:contain; }
.logo-copy{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.logo-title{
  font-size:13px;
  font-weight:600;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.logo-sub{
  font-size:11.5px;
  color:var(--ink-soft);
}
.btn-upload{
  flex-shrink:0;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px 14px;
  font-size:12.5px;
  font-weight:600;
  color:var(--ink);
  cursor:pointer;
  transition:border-color 0.2s ease, background 0.2s ease;
}
.btn-upload:hover{ border-color:var(--gold); background:var(--ivory-2); }

.btn-primary{
  margin-top:4px;
  width:100%;
  background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
  color:var(--white);
  border:none;
  border-radius:6px;
  padding:14px;
  font-size:15px;
  font-weight:700;
  letter-spacing:0.02em;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(157,124,24,0.28);
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-primary:hover{ transform:translateY(-1px); box-shadow:0 14px 28px rgba(157,124,24,0.34); }
.btn-primary:active{ transform:translateY(0); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

</style>
</head>

    <div class="panes">

      <!-- LOGIN PANE -->
      <section class="pane active" id="pane-login" role="tabpanel" aria-labelledby="tab-login">
        <div class="eyebrow">Partner Login</div>
        <h2 class="heading">업체 파트너센터</h2>
        <p class="subheading">등록하신 업체 계정으로 로그인하고 포토부스 예약과 촬영 데이터를 관리하세요.</p>

        <form id="form-login" novalidate>
          <div class="field">
            <label for="login-email">담당자 이메일</label>
            <div class="input-wrap">
              <input type="email" id="login-email" name="email" placeholder="business@example.com" autocomplete="email" required>
            </div>
            <div class="hint" id="login-email-hint"></div>
          </div>

          <div class="field">
            <label for="login-password">비밀번호</label>
            <div class="input-wrap">
              <input type="password" id="login-password" name="password" placeholder="비밀번호 입력" autocomplete="current-password" required>
              <button type="button" class="toggle-pw" data-target="login-password" aria-label="비밀번호 표시">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="hint" id="login-password-hint"></div>
          </div>

          <div class="row-between" style="justify-content:flex-end;">
            <a href="#" class="link-muted">비밀번호를 잊으셨나요?</a>
          </div>

          <button type="submit" class="btn-primary">로그인</button>
        </form>
      </section>

      <!-- SIGNUP PANE -->
      <section class="pane" id="pane-signup" role="tabpanel" aria-labelledby="tab-signup">
        <div class="eyebrow">Partner Sign Up</div>
        <h2 class="heading">업체 파트너 등록</h2>
        <p class="subheading">웨딩 포토부스 서비스를 함께할 업체 정보를 입력해주세요.</p>

        <form id="form-signup" novalidate>
          <div class="field">
            <label for="signup-company">업체명 (상호)</label>
            <div class="input-wrap">
              <input type="text" id="signup-company" name="company" placeholder="예: 스냅앤보우 스튜디오" autocomplete="organization" required>
            </div>
          </div>

          <div class="field">
            <label for="signup-biznum">사업자등록번호</label>
            <div class="input-wrap">
              <input type="text" id="signup-biznum" name="biznum" placeholder="000-00-00000" inputmode="numeric" required>
            </div>
            <div class="hint" id="signup-biznum-hint"></div>
          </div>

          <div class="field">
            <label for="signup-name">담당자 이름</label>
            <div class="input-wrap">
              <input type="text" id="signup-name" name="name" placeholder="담당자 성함" autocomplete="name" required>
            </div>
          </div>

          <div class="field">
            <label for="signup-phone">담당자 연락처</label>
            <div class="input-wrap">
              <input type="tel" id="signup-phone" name="phone" placeholder="010-0000-0000" autocomplete="tel" required>
            </div>
          </div>

          <div class="field">
            <label for="signup-email">이메일</label>
            <div class="input-wrap">
              <input type="email" id="signup-email" name="email" placeholder="business@example.com" autocomplete="email" required>
            </div>
            <div class="hint" id="signup-email-hint"></div>
          </div>

          <div class="field">
            <label for="signup-password">비밀번호</label>
            <div class="input-wrap">
              <input type="password" id="signup-password" name="password" placeholder="8자 이상 입력" autocomplete="new-password" required minlength="8">
              <button type="button" class="toggle-pw" data-target="signup-password" aria-label="비밀번호 표시">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="hint" id="signup-password-hint"></div>
          </div>

          <div class="field">
            <label for="signup-password2">비밀번호 확인</label>
            <div class="input-wrap">
              <input type="password" id="signup-password2" name="password2" placeholder="비밀번호 다시 입력" autocomplete="new-password" required>
              <button type="button" class="toggle-pw" data-target="signup-password2" aria-label="비밀번호 표시">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="hint" id="signup-password2-hint"></div>
          </div>

          <div class="field">
            <label for="signup-logo">브랜드/웨딩홀 로고</label>
            <div class="logo-upload" id="logo-upload">
              <input type="file" id="signup-logo" name="logo" accept=".png" hidden>
              <div class="logo-preview" id="logo-preview">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="9" cy="9" r="2"/>
                  <path d="M21 15l-5-5L5 21"/>
                </svg>
              </div>
              <div class="logo-copy">
                <span class="logo-title">PNG 파일을 업로드하세요</span>
                <span class="logo-sub">투명 배경 권장 · 최대 5MB</span>
              </div>
              <button type="button" class="btn-upload" id="logo-trigger">파일 선택</button>
            </div>
            <div class="hint" id="signup-logo-hint"></div>
          </div>

          <p class="terms">
            <label class="check" style="align-items:flex-start;">
              <input type="checkbox" name="agree" required style="margin-top:2px;">
              <span><a href="#" class="terms-link">이용약관 및 개인정보 처리방침에 동의합니다.</a></span>
            </label>
          </p>

          <button type="submit" class="btn-primary">가입하기</button>
        </form>
      </section>

    </div>
  </div>
</div>

<script>
const tabLogin = document.getElementById('tab-login');
const tabSignup = document.getElementById('tab-signup');
const paneLogin = document.getElementById('pane-login');
const paneSignup = document.getElementById('pane-signup');

function showLogin(){
  tabLogin.classList.add('active'); tabLogin.setAttribute('aria-selected','true');
  tabSignup.classList.remove('active'); tabSignup.setAttribute('aria-selected','false');
  paneLogin.classList.add('active'); paneSignup.classList.remove('active');
}
function showSignup(){
  tabSignup.classList.add('active'); tabSignup.setAttribute('aria-selected','true');
  tabLogin.classList.remove('active'); tabLogin.setAttribute('aria-selected','false');
  paneSignup.classList.add('active'); paneLogin.classList.remove('active');
}

tabLogin.addEventListener('click', showLogin);
tabSignup.addEventListener('click', showSignup);

// password visibility toggle
document.querySelectorAll('.toggle-pw').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const target = document.getElementById(btn.dataset.target);
    target.type = target.type === 'password' ? 'text' : 'password';
  });
});

// logo upload
const logoInput = document.getElementById('signup-logo');
const logoTrigger = document.getElementById('logo-trigger');
const logoUpload = document.getElementById('logo-upload');
const logoPreview = document.getElementById('logo-preview');
const logoTitle = document.querySelector('.logo-title');
const logoSub = document.querySelector('.logo-sub');
const MAX_LOGO_MB = 5;

function handleLogoFile(file){
  if(!file) return;
  if(file.type !== 'image/png'){
    setHint('signup-logo-hint','PNG 파일만 업로드할 수 있어요.');
    return;
  }
  if(file.size > MAX_LOGO_MB * 1024 * 1024){
    setHint('signup-logo-hint','파일 용량은 5MB 이하로 올려주세요.');
    return;
  }
  setHint('signup-logo-hint','');
  const url = URL.createObjectURL(file);
  logoPreview.innerHTML = `<img src="${url}" alt="업로드한 로고 미리보기">`;
  logoTitle.textContent = file.name;
  logoSub.textContent = `${(file.size / 1024 / 1024).toFixed(1)}MB · 변경하려면 다시 선택하세요`;
}

logoTrigger.addEventListener('click', ()=> logoInput.click());
logoInput.addEventListener('change', (e)=> handleLogoFile(e.target.files[0]));

['dragover','dragenter'].forEach(evt=>{
  logoUpload.addEventListener(evt, (e)=>{ e.preventDefault(); logoUpload.classList.add('drag'); });
});
['dragleave','drop'].forEach(evt=>{
  logoUpload.addEventListener(evt, (e)=>{ e.preventDefault(); logoUpload.classList.remove('drag'); });
});
logoUpload.addEventListener('drop', (e)=>{
  const file = e.dataTransfer.files[0];
  handleLogoFile(file);
});

// simple validation helpers
function setHint(id, msg){ document.getElementById(id).textContent = msg || ''; }
const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

document.getElementById('form-login').addEventListener('submit', (e)=>{
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  let ok = true;
  if(!emailRe.test(email)){ setHint('login-email-hint','올바른 이메일 주소를 입력해주세요.'); ok = false; } else setHint('login-email-hint','');
  if(pw.length < 1){ setHint('login-password-hint','비밀번호를 입력해주세요.'); ok = false; } else setHint('login-password-hint','');
  if(ok){ alert('로그인 처리 (데모)'); }
});

const biznumRe = /^\d{3}-\d{2}-\d{5}$/;

document.getElementById('form-signup').addEventListener('submit', (e)=>{
  e.preventDefault();
  const biznum = document.getElementById('signup-biznum').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pw = document.getElementById('signup-password').value;
  const pw2 = document.getElementById('signup-password2').value;
  let ok = true;
  if(!biznumRe.test(biznum)){ setHint('signup-biznum-hint','000-00-00000 형식으로 입력해주세요.'); ok = false; } else setHint('signup-biznum-hint','');
  if(!emailRe.test(email)){ setHint('signup-email-hint','올바른 이메일 주소를 입력해주세요.'); ok = false; } else setHint('signup-email-hint','');
  if(pw.length < 8){ setHint('signup-password-hint','비밀번호는 8자 이상이어야 해요.'); ok = false; } else setHint('signup-password-hint','');
  if(pw !== pw2){ setHint('signup-password2-hint','비밀번호가 일치하지 않아요.'); ok = false; } else setHint('signup-password2-hint','');
  if(ok){ alert('회원가입 처리 (데모)'); }
});

</script>
</body>
</html>
