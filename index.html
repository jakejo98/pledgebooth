<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFF">
<title>Vow - 회원가입/로그인 </title>
<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/modal.css">
<script type="module" src="js/auth.js"></script>
</head>
<body>

<section class="common_section">
  <div class="container">
    <!-- 로고 영역 -->
    <div class="logo_wrap">
      <img src="assets/images/logo.svg" class="logo" alt="로고 이미지">
      <p class="logo_description">가장 아름다운 순간을 기록하세요.</p>
    </div>

    <div class="auth_tabs" role="tablist" aria-label="로그인 또는 회원가입 선택">
      <button class="auth_tab active" id="auth_tab_login" role="tab" aria-selected="true" aria-controls="pane_login">로그인</button>
      <button class="auth_tab" id="auth_tab_signup" role="tab" aria-selected="false" aria-controls="pane_signup">회원가입</button>
    </div>

    <div class="tab_panels">

      <!-- LOGIN PANE -->
      <section class="tab_panel active" id="pane_login" role="tabpanel" aria-labelledby="auth_tab_login">
        <div class="eyebrow">Partner Login</div>
        <h2 class="heading">웨딩홀 업체 로그인</h2>

        <form id="form_login" novalidate>
          <div class="field">
            <label for="login_email">이메일</label>
            <input type="email" id="login_email" name="email" placeholder="business@example.com" autocomplete="email" required>
            <div class="hint" id="login_email_hint"></div>
          </div>

          <div class="field">
            <label for="login_password">비밀번호</label>
            <div class="input_row">
              <input type="password" id="login_password" name="password" placeholder="비밀번호 입력" autocomplete="current-password" required>
              <button type="button" class="toggle_pw" data-target="login_password" aria-label="비밀번호 표시">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="hint" id="login_password_hint"></div>
          </div>

          <div class="row_end">
            <a href="#" class="link_muted" id="forgot_password_link">비밀번호를 잊으셨나요?</a>
          </div>

          <button type="submit" class="btn_primary">로그인</button>
        </form>
      </section>

      <!-- SIGNUP PANE -->
      <section class="tab_panel" id="pane_signup" role="tabpanel" aria-labelledby="auth_tab_signup">
        <div id="signup_form_view">
        <div class="eyebrow">Partner Sign Up</div>
        <h2 class="heading">웨딩홀 업체 등록</h2>

        <form id="form_signup" novalidate>
          <div class="field">
            <label for="signup_company">업체명</label>
            <input type="text" id="signup_company" name="company" placeholder="보우 스튜디오" autocomplete="organization" required>
            <div class="hint" id="signup_company_hint"></div>
          </div>

          <div class="field">
            <label for="signup_name">이름</label>
            <input type="text" id="signup_name" name="name" placeholder="보우" autocomplete="name" required>
            <div class="hint" id="signup_name_hint"></div>
          </div>

          <div class="field">
            <label for="signup_phone">연락처</label>
            <input type="tel" id="signup_phone" name="phone" placeholder="010-0000-0000" autocomplete="tel" inputmode="numeric" maxlength="13" required>
            <div class="hint" id="signup_phone_hint"></div>
          </div>

          <div class="field">
            <label for="signup_email">이메일</label>
            <input type="email" id="signup_email" name="email" placeholder="business@example.com" autocomplete="email" required>
            <div class="hint" id="signup_email_hint"></div>
          </div>

          <div class="field">
            <label for="signup_password">비밀번호</label>
            <div class="input_row">
              <input type="password" id="signup_password" name="password" placeholder="8자 이상 입력" autocomplete="new-password" required minlength="8">
              <button type="button" class="toggle_pw" data-target="signup_password" aria-label="비밀번호 표시">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="hint" id="signup_password_hint"></div>
          </div>

          <div class="field">
            <label for="signup_password_confirm">비밀번호 확인</label>
            <div class="input_row">
              <input type="password" id="signup_password_confirm" name="passwordConfirm" placeholder="비밀번호 다시 입력" autocomplete="new-password" required>
              <button type="button" class="toggle_pw" data-target="signup_password_confirm" aria-label="비밀번호 표시">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="hint" id="signup_password_confirm_hint"></div>
          </div>

          <p class="terms">
            <label class="check">
              <input type="checkbox" name="agree" required>
              <span><a href="#" class="terms_link">이용약관 및 개인정보 처리방침에 동의합니다.</a></span>
            </label>
          </p>

          <button type="submit" class="btn_primary">가입하기</button>
        </form>
        </div>

        <div id="signup_success_view" hidden>
          <div class="eyebrow">Pending approval</div>
          <h2 class="heading">가입 신청이 접수됐어요</h2>
          <p class="subheading" id="signup_success_message"></p>
          <button type="button" class="btn_primary" id="go_to_login_after_signup">로그인 화면으로</button>
        </div>
      </section>

    </div>
  </div>
</section>

<div id="modal_root"></div>

</body>
</html>
